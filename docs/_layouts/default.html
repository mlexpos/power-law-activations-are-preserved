<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] } };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js"></script>
  <style>
    :root { --fg: #1f2328; --muted: #59636e; --accent: #1b6ca8; --bg: #ffffff; --rule: #d1d9e0; --code: #f6f8fa; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #e6edf3; --muted: #9198a1; --accent: #6cb6ff; --bg: #0d1117; --rule: #30363d; --code: #161b22; }
    }
    body { margin: 0; background: var(--bg); color: var(--fg);
           font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    header, main, footer { max-width: 860px; margin: 0 auto; padding: 0 16px; }
    header { border-bottom: 1px solid var(--rule); padding-top: 18px; padding-bottom: 10px; }
    header a { color: var(--fg); text-decoration: none; font-weight: 600; }
    header .sub { color: var(--muted); font-size: 14px; }
    main { padding-top: 8px; padding-bottom: 40px; }
    a { color: var(--accent); }
    h1 { font-size: 1.7em; line-height: 1.25; margin-top: 1em; }
    h2 { font-size: 1.3em; border-bottom: 1px solid var(--rule); padding-bottom: 4px; margin-top: 1.8em; }
    h3 { font-size: 1.08em; margin-top: 1.4em; }
    code { background: var(--code); padding: 1px 4px; border-radius: 4px; font-size: 0.92em; }
    pre { background: var(--code); padding: 12px; border-radius: 6px; overflow-x: auto; }
    pre code { background: none; padding: 0; }
    img { max-width: 100%; height: auto; background: #fff; border-radius: 4px; }
    table { border-collapse: collapse; margin: 1em 0; display: block; overflow-x: auto; }
    th, td { border: 1px solid var(--rule); padding: 5px 10px; text-align: left; }
    blockquote { color: var(--muted); border-left: 3px solid var(--rule); margin-left: 0; padding-left: 14px; }
    nav { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; font-size: 14px; }
    nav a { color: var(--accent); font-weight: 400; }
    nav a.here { color: var(--fg); font-weight: 600; text-decoration: none; }
    .caption { color: var(--muted); font-size: 0.93em; margin-top: -0.4em; }
    .lead { font-size: 1.05em; }
    footer { color: var(--muted); font-size: 13px; border-top: 1px solid var(--rule); padding-top: 10px; padding-bottom: 30px; }
    mjx-container { overflow-x: auto; overflow-y: hidden; }
  </style>
</head>
<body>
  <header>
    <a href="{{ site.baseurl }}/">{{ site.title }}</a>
    <div class="sub">{{ site.description }}</div>
    <nav>
      {% for item in site.nav %}<a href="{{ site.baseurl }}{{ item.url }}"{% if page.url == item.url %} class="here"{% endif %}>{{ item.title }}</a>{% endfor %}
    </nav>
  </header>
  <main>
    {{ content }}
  </main>
  <footer>
    Companion to <a href="{{ site.paper_url }}">{{ site.paper_title }}</a> ({{ site.paper_authors }}).
    Code: <a href="{{ site.repo_url }}">{{ site.repo_url }}</a>.
  </footer>
</body>
</html>
